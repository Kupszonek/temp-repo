# Generated by TdA template generator — run: docker compose up
# network_mode: host mirrors Tour de Cloud, where all containers share one pod's
# localhost. Host ports 3000, 3001 and 3306 must be free.
# Dev only: no Caddy. Frontend at http://localhost:3000, API at http://localhost:3001/api.
name: tda-app

services:
  web:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0 --port 3000 --strictPort"
    volumes:
      - ./frontend:/app
      - web-node-modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    env_file: ./frontend/.env
    network_mode: host

  server:
    image: node:22
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    volumes:
      - ./backend:/app
      - server-node-modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
    env_file: ./backend/.env
    network_mode: host
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    network_mode: host
    environment:
      MYSQL_DATABASE: product
      MYSQL_ROOT_PASSWORD: password
      MYSQL_USER: tda_user
      MYSQL_PASSWORD: strongPassword?
    volumes:
      - ./backend/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  web-node-modules:
  server-node-modules:
